name: Deploy FOWYAD

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this site repository
        uses: actions/checkout@v4

      - name: Checkout FOWYAD source
        uses: actions/checkout@v4
        with:
          repository: keep-calm-and-carry-off/fowyad
          ref: main
          path: site

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install
        working-directory: site
        run: npm ci

      - name: Build the static site for the account root
        working-directory: site
        run: npm run pages:build
        env:
          NEXT_PUBLIC_BASE_PATH: ""
          NEXT_PUBLIC_SITE_URL: https://keep-calm-and-carry-off.github.io

      - name: Keep Next.js assets out of Jekyll
        run: touch site/out/.nojekyll

      - name: Publish to the account root
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: site/out
          clean: true
